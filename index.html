/* ── SEAT SEARCH — multi-match ── */
function SeatSearch(props){
  const[query,setQuery]=useState("");
  const[matches,setMatches]=useState([]);
  const[selected,setSelected]=useState(null);
  const[searched,setSearched]=useState(false);

  const doSearch=(val)=>{
    setQuery(val);

    const q=val.trim().toLowerCase();
    const m=GUESTS.filter(g=>g.name.toLowerCase().includes(q));
    setMatches(m);

  };

function ZoomableImage(props){
  var containerRef=React.useRef(null);
  var imgRef=React.useRef(null);
  var stateRef=React.useRef({scale:1,x:0,y:0,startDist:0,startScale:1,startX:0,startY:0,lastTap:0,isPinching:false,isDragging:false,dragStartX:0,dragStartY:0,dragOffsetX:0,dragOffsetY:0});

  function getDistance(t1,t2){
    var dx=t1.clientX-t2.clientX;
    var dy=t1.clientY-t2.clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }

  function applyTransform(){
    var s=stateRef.current;
    if(imgRef.current){
      imgRef.current.style.transform="translate("+s.x+"px,"+s.y+"px) scale("+s.scale+")";
    }
  }

  function clampPosition(){
    var s=stateRef.current;
    if(s.scale<=1){s.x=0;s.y=0;return;}
    var container=containerRef.current;
    if(!container)return;
    var w=container.offsetWidth;
    var h=container.offsetHeight;
    var maxX=(w*s.scale-w)/2;
    var maxY=(h*s.scale-h)/2;
    s.x=Math.max(-maxX,Math.min(maxX,s.x));
    s.y=Math.max(-maxY,Math.min(maxY,s.y));
  }

  function onTouchStart(e){
    var s=stateRef.current;
    if(e.touches.length===2){
      e.preventDefault();
      s.isPinching=true;
      s.isDragging=false;
      s.startDist=getDistance(e.touches[0],e.touches[1]);
      s.startScale=s.scale;
    }else if(e.touches.length===1&&s.scale>1){
      s.isDragging=true;
      s.isPinching=false;
      s.dragStartX=e.touches[0].clientX;
      s.dragStartY=e.touches[0].clientY;
      s.dragOffsetX=s.x;
      s.dragOffsetY=s.y;
    }
    var now=Date.now();
    if(e.touches.length===1&&now-s.lastTap<300){
      e.preventDefault();
      if(s.scale>1){s.scale=1;s.x=0;s.y=0;}
      else{s.scale=2.5;s.x=0;s.y=0;}
      applyTransform();
    }
    s.lastTap=now;
  }

  function onTouchMove(e){
    var s=stateRef.current;
    if(s.isPinching&&e.touches.length===2){
      e.preventDefault();
      var dist=getDistance(e.touches[0],e.touches[1]);

      s.y=s.dragOffsetY+(e.touches[0].clientY-s.dragStartY);
      clampPosition();
      applyTransform();
    }
  }

  function onTouchEnd(e){
    var s=stateRef.current;
    s.isPinching=false;
    if(e.touches.length===0)s.isDragging=false;
    if(s.scale<=1){s.scale=1;s.x=0;s.y=0;applyTransform();}
  }

  return React.createElement("div",{
    ref:containerRef,
    onTouchStart:onTouchStart,
    onTouchMove:onTouchMove,
    onTouchEnd:onTouchEnd,
    style:{maxWidth:480,margin:"0 auto",border:"1px solid #e0ebe3",overflow:"hidden",touchAction:"pan-x pan-y",position:"relative"}
  },

    },

        alt:props.alt,

      props.highlight&&React.createElement("svg",{
        viewBox:"0 0 "+IMG_W+" "+IMG_H,

            "@keyframes pulse{0%{r:"+((props.highlight.r||22)+12)+";opacity:0.6}100%{r:"+((props.highlight.r||22)+28)+";opacity:0}}"+
            "@keyframes pulse2{0%{r:"+((props.highlight.r||22)+6)+";opacity:0.4}100%{r:"+((props.highlight.r||22)+18)+";opacity:0}}"
          )

function sbHeaders(){return {"Authorization":"Bearer "+SB_KEY,"apikey":SB_KEY};}

function sbUpload(file){
  var ext=file.name.split(".").pop()||"jpg";
  var name=Date.now()+"_"+Math.random().toString(36).slice(2,8)+"."+ext;
  return fetch(SB_URL+"/storage/v1/object/"+SB_BUCKET+"/"+name,{
    method:"POST",
    headers:Object.assign({"Content-Type":file.type,"x-upsert":"true"},sbHeaders()),
    body:file
  }).then(function(r){
    if(!r.ok)throw new Error("Upload failed: "+r.status);
    return SB_URL+"/storage/v1/object/public/"+SB_BUCKET+"/"+name;
  });
}

function sbListPhotos(){
  return fetch(SB_URL+"/storage/v1/object/list/"+SB_BUCKET,{
    method:"POST",
    headers:Object.assign({"Content-Type":"application/json"},sbHeaders()),
    body:JSON.stringify({prefix:"",limit:500,offset:0,sortBy:{column:"created_at",order:"desc"}})
  }).then(function(r){return r.json();})
  .then(function(files){
    return files.filter(function(f){return f.name&&!f.name.startsWith(".")&&f.name!=="app-config.json"&&f.name!=="download-counts.json";}).map(function(f){
      return {name:f.name,url:SB_URL+"/storage/v1/object/public/"+SB_BUCKET+"/"+f.name,created:f.created_at,size:f.metadata&&f.metadata.size||0};
    });
  });
}

function sbDeletePhoto(name){
  return fetch(SB_URL+"/storage/v1/object/"+SB_BUCKET+"/"+encodeURIComponent(name),{
    method:"DELETE",
    headers:sbHeaders()
  }).then(function(r){
    if(!r.ok){return r.text().then(function(t){
      console.error("Delete failed ("+r.status+"):",t);
      throw new Error("Status "+r.status+": "+t);
    });}
    return r;
  });
}

    .then(function(r){if(!r.ok)throw new Error();return r.json();})
    .catch(function(){return {};});
}

function sbTrackDownload(photoName){
  sbLoadDlCounts().then(function(counts){
    counts[photoName]=(counts[photoName]||0)+1;
    var jsonStr=JSON.stringify(counts);
    return fetch(SB_URL+"/storage/v1/object/"+SB_BUCKET+"/"+SB_DL_KEY,{
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json","x-upsert":"true"},sbHeaders()),
      body:jsonStr
    }).then(function(r){
      if(!r.ok)r.text().then(function(t){console.error("Track download failed:",r.status,t);});
    });
  }).catch(function(e){console.error("Track download error:",e);});
}

function sbLoadConfig(){
  return fetch(SB_URL+"/storage/v1/object/public/"+SB_BUCKET+"/"+SB_CONFIG_KEY+"?t="+Date.now())
    .then(function(r){if(!r.ok)throw new Error("No config");return r.json();});
}

function sbSaveConfig(data){
  var jsonStr=JSON.stringify(data);
  return fetch(SB_URL+"/storage/v1/object/"+SB_BUCKET+"/"+SB_CONFIG_KEY,{
    method:"POST",
    headers:Object.assign({"Content-Type":"application/octet-stream","x-upsert":"true"},sbHeaders()),
    body:jsonStr
  });
}

var dlAnchor=null;
function getDlAnchor(){
  if(!dlAnchor){dlAnchor=document.createElement("a");dlAnchor.style.display="none";document.body.appendChild(dlAnchor);}
  return dlAnchor;
}

function triggerDownload(url,name){
  fetch(url).then(function(r){return r.blob();}).then(function(blob){
    var blobUrl=URL.createObjectURL(blob);
    var a=getDlAnchor();
    a.href=blobUrl;
    a.download=name||"photo.jpg";
    a.click();
    setTimeout(function(){URL.revokeObjectURL(blobUrl);},10000);
  }).catch(function(){
    window.open(url+"?download=","_blank");
  });
}

function downloadPhoto(url,name){
  sbTrackDownload(name);
  triggerDownload(url,name);
}
