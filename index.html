function ZoomableImage(props){

      s.isPinching=false;

      s.dragStartY=e.touches[0].clientY;

function sbHeaders(){return {"Authorization":"Bearer "+SB_KEY,"apikey":SB_KEY};}

function sbUpload(file){
  var ext=file.name.split(".").pop()||"jpg";
  var name=Date.now()+"_"+Math.random().toString(36).slice(2,8)+"."+ext;
  return fetch(SB_URL+"/storage/v1/object/"+SB_BUCKET+"/"+name,{
    method:"POST",
    headers:Object.assign({"Content-Type":file.type,"x-upsert":"true"},sbHeaders()),
    body:file
  }).then(function(r){
    if(!r.ok)throw new Error("Upload failed: "+r.status);
    return SB_URL+"/storage/v1/object/public/"+SB_BUCKET+"/"+name;
  });
}

function sbListPhotos(){
  return fetch(SB_URL+"/storage/v1/object/list/"+SB_BUCKET,{
    method:"POST",
    headers:Object.assign({"Content-Type":"application/json"},sbHeaders()),
    body:JSON.stringify({prefix:"",limit:500,offset:0,sortBy:{column:"created_at",order:"desc"}})
  }).then(function(r){return r.json();})
  .then(function(files){
    return files.filter(function(f){return f.name&&!f.name.startsWith(".")&&f.name!=="app-config.json"&&f.name!=="download-counts.json";}).map(function(f){
      return {name:f.name,url:SB_URL+"/storage/v1/object/public/"+SB_BUCKET+"/"+f.name,created:f.created_at};
    });
  });
}

function sbDeletePhoto(name){
  return fetch(SB_URL+"/storage/v1/object/"+SB_BUCKET+"/"+encodeURIComponent(name),{
    method:"DELETE",
    headers:sbHeaders()
  }).then(function(r){
    if(!r.ok){return r.text().then(function(t){
      console.error("Delete failed ("+r.status+"):",t);
      throw new Error("Status "+r.status+": "+t);
    });}
    return r;
  });
}

/* ── SUPABASE CONFIG SYNC ── */
var SB_CONFIG_KEY="app-config.json";
var SB_DL_KEY="download-counts.json";

function sbLoadDlCounts(){
  return fetch(SB_URL+"/storage/v1/object/public/"+SB_BUCKET+"/"+SB_DL_KEY+"?t="+Date.now())
    .then(function(r){if(!r.ok)throw new Error();return r.json();})
    .catch(function(){return {};});
}

function sbTrackDownload(photoName){
  sbLoadDlCounts().then(function(counts){
    counts[photoName]=(counts[photoName]||0)+1;
    var jsonStr=JSON.stringify(counts);
    return fetch(SB_URL+"/storage/v1/object/"+SB_BUCKET+"/"+SB_DL_KEY,{
      method:"POST",
      headers:Object.assign({"Content-Type":"application/octet-stream","x-upsert":"true"},sbHeaders()),
      body:jsonStr
    }).then(function(r){
      if(!r.ok){r.text().then(function(t){console.error("Track download failed:",r.status,t);});}
      else{console.log("Download tracked:",photoName,counts[photoName]);}
    });
  }).catch(function(e){console.error("Track download error:",e);});
}

function sbLoadConfig(){
  return fetch(SB_URL+"/storage/v1/object/public/"+SB_BUCKET+"/"+SB_CONFIG_KEY+"?t="+Date.now())
    .then(function(r){if(!r.ok)throw new Error("No config");return r.json();});
}

function sbSaveConfig(data){
  var jsonStr=JSON.stringify(data);
  return fetch(SB_URL+"/storage/v1/object/"+SB_BUCKET+"/"+SB_CONFIG_KEY,{
    method:"POST",
    headers:Object.assign({"Content-Type":"application/octet-stream","x-upsert":"true"},sbHeaders()),
    body:jsonStr
  });
}

/* ── SLIDE PHOTO ── */
function SlidePhoto(props){
  var ref=React.useRef(null);
  var dir=props.dir||"left";
  useEffect(function(){
    var el=ref.current;if(!el)return;
    el.style.transition="none";
    el.style.transform="translateX("+(dir==="left"?"80":"-80")+"px)";
    el.style.opacity="0";
    void el.offsetWidth;
    el.style.transition="transform 0.35s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 0.3s ease";
    el.style.transform="translateX(0)";
    el.style.opacity="1";
  },[props.photo.name]);
  var isVideo=/\.(mp4|mov|webm|avi)$/i.test(props.photo.name);
  return React.createElement("div",{ref:ref,onClick:function(e){e.stopPropagation();},style:{position:"relative",maxWidth:"85%",maxHeight:"80vh"}},
    isVideo?React.createElement("video",{src:props.photo.url,controls:true,autoPlay:true,style:{maxWidth:"100%",maxHeight:"80vh"}}):
    React.createElement("img",{src:props.photo.url,alt:"Wedding photo",style:{maxWidth:"100%",maxHeight:"80vh",objectFit:"contain",display:"block"}}),
    !isVideo&&!props.isAdmin&&React.createElement("img",{src:WATERMARK,alt:"",style:{position:"absolute",bottom:8,right:8,width:"20%",opacity:0.8,pointerEvents:"none"}})
  );
}

function downloadWithWatermark(photoUrl,photoName){
  sbTrackDownload(photoName);
  triggerDownload(photoUrl,photoName);
}

var dlAnchor=null;
function getDlAnchor(){
  if(!dlAnchor){dlAnchor=document.createElement("a");dlAnchor.style.display="none";document.body.appendChild(dlAnchor);}
  return dlAnchor;
}

function triggerDownload(url,name){
  fetch(url).then(function(r){return r.blob();}).then(function(blob){
    var blobUrl=URL.createObjectURL(blob);
    var a=getDlAnchor();
    a.href=blobUrl;
    a.download=name||"photo.jpg";
    a.click();
    setTimeout(function(){URL.revokeObjectURL(blobUrl);},10000);
  }).catch(function(){
    window.open(url+"?download=","_blank");
  });
}

function downloadPhoto(url,name){
  sbTrackDownload(name);
  triggerDownload(url,name);
}
