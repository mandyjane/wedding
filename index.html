<script type="text/javascript">
var useState=React.useState,useEffect=React.useEffect;

const S={
  primary:"#5a7d62",sage:"#80b090",text:"#2c2c2c",
  spaced:{fontFamily:"'Cormorant Garamond',serif",letterSpacing:"0.18em",textTransform:"uppercase"},
  sans:{fontFamily:"'DM Sans',sans-serif"},
};

function Tabs({tabs,active,onChange}){
  return React.createElement("div",{style:{display:"flex",border:"1px solid #e0ebe3",margin:"0 auto",maxWidth:440}},
    tabs.map(t=>React.createElement("button",{key:t.id,onClick:()=>onChange(t.id),style:{
      flex:1,padding:"11px 0",border:"none",cursor:"pointer",
      ...S.spaced,fontSize:9,letterSpacing:"0.12em",fontWeight:active===t.id?600:400,
      background:active===t.id?"#f0f6f1":"transparent",
      color:active===t.id?S.primary:S.text+"77",
      transition:"all 0.2s",borderBottom:active===t.id?"2px solid "+S.sage:"2px solid transparent",
    }},t.label))
  );
}

/* ── SEAT SEARCH — multi-match ── */
function SeatSearch(){
  const[query,setQuery]=useState("");
  const[matches,setMatches]=useState([]);
  const[selected,setSelected]=useState(null);
  const[searched,setSearched]=useState(false);

  const doSearch=(val)=>{
    setQuery(val);
    setSelected(null);
    if(!val.trim()||val.trim().length<2){setSearched(false);setMatches([]);return;}
    setSearched(true);
    const q=val.trim().toLowerCase();
    const m=GUESTS.filter(g=>g.name.toLowerCase().includes(q));
    setMatches(m);
    if(m.length===1)setSelected(m[0]);
  };

  return React.createElement("div",{style:{padding:"0 24px 24px",textAlign:"center"}},
    React.createElement("div",{style:{...S.spaced,fontSize:11,color:S.sage,marginBottom:14}},"FIND YOUR SEAT"),
    React.createElement("div",{style:{maxWidth:360,margin:"0 auto"}},
      React.createElement("input",{value:query,
        onChange:e=>doSearch(e.target.value),
        placeholder:"Enter your name...",
        style:{width:"100%",padding:"14px 16px",border:"1px solid #d5e3d9",fontSize:15,...S.sans,background:"#fff",color:S.text,boxSizing:"border-box"}
      })
    ),

    /* Multiple matches — tap to select */
    searched&&matches.length>1&&!selected&&React.createElement("div",{style:{
      maxWidth:340,margin:"20px auto 0",textAlign:"center",
    }},
      React.createElement("div",{style:{...S.spaced,fontSize:10,color:S.sage,marginBottom:6}},
        "WE FOUND "+matches.length+" MATCHES"),
      React.createElement("div",{style:{...S.sans,fontSize:12,color:S.text+"77",marginBottom:12}},
        "Tap your name below"),
      React.createElement("div",{style:{border:"1px solid #e0ebe3"}},
        matches.map((g,i)=>React.createElement("button",{key:i,onClick:()=>setSelected(g),style:{
          display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",
          padding:"14px 16px",background:"#fff",border:"none",cursor:"pointer",
          borderBottom:i<matches.length-1?"1px solid #e0ebe3":"none",
          transition:"background 0.15s",
        }},
          React.createElement("span",{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:16,color:S.primary}},g.name),
          React.createElement("span",{style:{...S.spaced,fontSize:9,color:S.sage}},g.table==="Bridal"?"BRIDAL":"TABLE "+g.table)
        ))
      )
    ),

    /* Single result or selected from list */
    searched&&selected&&React.createElement("div",{style:{
      maxWidth:320,margin:"24px auto 0",textAlign:"center",padding:"28px 24px",
      border:"1px solid #e0ebe3",
    }},
      React.createElement("div",{style:{...S.spaced,fontSize:10,color:S.sage,marginBottom:6}},"WELCOME"),
      React.createElement("div",{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:24,color:S.primary,marginBottom:16,fontWeight:500}},selected.name),
      React.createElement("div",{style:{
        width:100,height:100,borderRadius:"50%",border:"1.5px solid "+S.sage,
        display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",margin:"0 auto",
      }},
        React.createElement("span",{style:{...S.spaced,fontSize:9,color:S.sage}},selected.table==="Bridal"?"BRIDAL":"TABLE"),
        React.createElement("span",{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:selected.table==="Bridal"?16:38,fontWeight:300,color:S.primary,lineHeight:1,marginTop:3}},
          selected.table==="Bridal"?"Table":selected.table)
      ),
      matches.length>1&&React.createElement("button",{onClick:()=>setSelected(null),style:{
        ...S.sans,fontSize:12,color:S.sage,background:"none",border:"none",cursor:"pointer",
        marginTop:16,textDecoration:"underline",
      }},"Not you? Go back")
    ),

    /* No results */
    searched&&matches.length===0&&React.createElement("div",{style:{
      maxWidth:320,margin:"24px auto 0",textAlign:"center",padding:20,border:"1px solid #e5d5d5",
    }},
      React.createElement("p",{style:{...S.sans,fontSize:13,color:"#a55"}},"We couldn\u2019t find that name. Please try your full name or check with the couple.")
    )
  );
}

  return React.createElement("div",{style:{padding:"24px",maxWidth:420,margin:"0 auto"}},

function ZoomableImage(props){
  var containerRef=React.useRef(null);
  var imgRef=React.useRef(null);
  var stateRef=React.useRef({scale:1,x:0,y:0,startDist:0,startScale:1,startX:0,startY:0,lastTap:0,isPinching:false,isDragging:false,dragStartX:0,dragStartY:0,dragOffsetX:0,dragOffsetY:0});

  function getDistance(t1,t2){
    var dx=t1.clientX-t2.clientX;
    var dy=t1.clientY-t2.clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }

  function applyTransform(){
    var s=stateRef.current;
    if(imgRef.current){
      imgRef.current.style.transform="translate("+s.x+"px,"+s.y+"px) scale("+s.scale+")";
    }
  }

  function clampPosition(){
    var s=stateRef.current;
    if(s.scale<=1){s.x=0;s.y=0;return;}
    var container=containerRef.current;
    if(!container)return;
    var w=container.offsetWidth;
    var h=container.offsetHeight;
    var maxX=(w*s.scale-w)/2;
    var maxY=(h*s.scale-h)/2;
    s.x=Math.max(-maxX,Math.min(maxX,s.x));
    s.y=Math.max(-maxY,Math.min(maxY,s.y));
  }

  function onTouchStart(e){
    var s=stateRef.current;
    if(e.touches.length===2){
      e.preventDefault();
      s.isPinching=true;
      s.isDragging=false;
      s.startDist=getDistance(e.touches[0],e.touches[1]);
      s.startScale=s.scale;
    }else if(e.touches.length===1&&s.scale>1){
      s.isDragging=true;
      s.isPinching=false;
      s.dragStartX=e.touches[0].clientX;
      s.dragStartY=e.touches[0].clientY;
      s.dragOffsetX=s.x;
      s.dragOffsetY=s.y;
    }
    var now=Date.now();
    if(e.touches.length===1&&now-s.lastTap<300){
      e.preventDefault();
      if(s.scale>1){s.scale=1;s.x=0;s.y=0;}
      else{s.scale=2.5;s.x=0;s.y=0;}
      applyTransform();
    }
    s.lastTap=now;
  }

  function onTouchMove(e){
    var s=stateRef.current;
    if(s.isPinching&&e.touches.length===2){
      e.preventDefault();
      var dist=getDistance(e.touches[0],e.touches[1]);
      s.scale=Math.max(1,Math.min(5,s.startScale*(dist/s.startDist)));
      clampPosition();
      applyTransform();
    }else if(s.isDragging&&e.touches.length===1&&s.scale>1){
      e.preventDefault();
      s.x=s.dragOffsetX+(e.touches[0].clientX-s.dragStartX);
      s.y=s.dragOffsetY+(e.touches[0].clientY-s.dragStartY);
      clampPosition();
      applyTransform();
    }
  }

  function onTouchEnd(e){
    var s=stateRef.current;
    s.isPinching=false;
    if(e.touches.length===0)s.isDragging=false;
    if(s.scale<=1){s.scale=1;s.x=0;s.y=0;applyTransform();}
  }

  return React.createElement("div",{
    ref:containerRef,
    onTouchStart:onTouchStart,
    onTouchMove:onTouchMove,
    onTouchEnd:onTouchEnd,
    style:{maxWidth:480,margin:"0 auto",border:"1px solid #e0ebe3",overflow:"hidden",touchAction:"pan-x pan-y"}
  },
    React.createElement("img",{
      ref:imgRef,
      src:props.src,
      alt:props.alt,
      style:{width:"100%",display:"block",transformOrigin:"center center",transition:"transform 0.1s ease-out"}
    })
  );
}
